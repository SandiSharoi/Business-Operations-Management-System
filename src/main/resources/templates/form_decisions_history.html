<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Approver Past Decisions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    .action-icon {
        font-size: 18px;
        cursor: pointer;
        border: none;
        background: none;
        transition: transform 0.2s ease-in-out;
    }

    .edit-icon {
        color: #ffc107;
    }

    .delete-icon {
        color: red;
    }

    .view-icon {
        color: blue;
    }

    .action-icon:hover {
        transform: scale(1.2);
    }
  </style>


</head>
<body>
<div class="container mt-5">
  <h2 class="text-center">Past Form Decisions</h2><br><br>

  <a th:href="@{/download/excel/{approverId}(approverId=${approverId})}" class="btn btn-success">
    <i class="fas fa-file-excel"></i> Download as Excel
  </a>
  <a th:href="@{/download/pdf/{approverId}(approverId=${approverId})}" class="btn btn-danger">
    <i class="fa-solid fa-file-pdf"></i> Download as PDF
  </a>

  <a th:href="@{/download/csv/{approverId}(approverId=${approverId})}" class="btn btn-info">
    <i class="fa-solid fa-file-csv"></i> Download as CSV
  </a>

  <div class="table-responsive">
    <table class="table table-striped table-bordered text-center">
      <thead class="table-primary">
      <tr>
        <th>#</th>
        <th>Form ID</th>
        <th>Staff ID</th>
        <th>Staff Name</th>
        <th>Project ID</th>
        <th>Project Name</th>
        <th>Actual Date</th>
        <th>Duration</th>
        <th>Status</th>
        <th>Details</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="form, iterStat : ${pastDecisions}">
        <td th:text="${iterStat.index + 1}"></td>
        <td th:text="${form.formApplyId}"></td>
        <td th:text="${form.employee.staffId}"></td>
        <td th:text="${form.employee.name}"></td>
        <td th:text="${form.projectId}"></td>
        <td th:text="${form.projectName}"></td>
        <td th:text="${form.actualDate}"></td>

        <td th:text="${form.duration}"></td>
        <td th:text="${form.formStatus}" th:classappend="${form.formStatus == 'Approved' ? 'text-success fw-bold' : (form.formStatus == 'Rejected' ? 'text-danger fw-bold' : '')}">
        </td>

        <td class="text-center">
          <a th:href="@{/form/detail/{formId}(formId=${form.formApplyId}, source='form_past_decisions')}"  class="action-icon view-icon">
            <i class="fa-solid fa-eye"></i>
          </a>
        </td>

      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
